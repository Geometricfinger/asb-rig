name: ci
# Fork PRs run with `pull_request` (read-only token, no secrets). No secrets are used anywhere.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: flite (CMU, BSD-style) for the real M-06 speech test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq flite
      - name: real eye-tracker reference recordings for M-01 (pinned, sha256-checked, CC BY 4.0 / MIT)
        run: python scripts/fetch_eye_reference_data.py
      - run: ruff check oiris tests scripts
      - run: mypy oiris
      - run: python -m pytest -q
        env:
          OIRIS_REQUIRE_FLITE: "1"
          OIRIS_REQUIRE_REAL_EYE: "1"
      - run: python scripts/license_check.py
      - name: headless golden suite (E-23)
        run: |
          for f in golden/expected/*.json; do
            s=$(basename "$f" .json)
            oiris --headless --scenario "$s" --steps 3 --expect "$f" > /dev/null
          done
          python scripts/make_synthetic_golden.py --check

  build:
    name: build (macOS, APK + macOS artifact, one commit)
    runs-on: macos-latest
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: pip install -e ".[dev]"
      - run: scripts/build_all.sh
      - uses: actions/upload-artifact@v4
        with:
          name: o-iris-${{ github.sha }}
          path: dist/${{ github.sha }}/
          retention-days: 14
