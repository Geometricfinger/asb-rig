name: ci
# Fork PRs run with `pull_request` (read-only token, no secrets). No secrets are used anywhere.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check asb tests scripts
      - run: mypy asb
      - run: python -m pytest -q
      - run: python scripts/license_check.py
      - name: headless golden suite (E-23)
        run: |
          for f in golden/expected/*.json; do
            s=$(basename "$f" .json)
            asb --headless --scenario "$s" --steps 3 --expect "$f" > /dev/null
          done

  build:
    name: build (macOS, APK + macOS artifact, one commit)
    runs-on: macos-latest
    needs: test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: pip install -e .
      - run: scripts/build_all.sh
      - uses: actions/upload-artifact@v4
        with:
          name: asb-${{ github.sha }}
          path: dist/${{ github.sha }}/
          retention-days: 14
