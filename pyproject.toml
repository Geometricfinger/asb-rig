[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "o-iris"
version = "0.1.0"
description = "Anomaly Signature Bench: passive multi-sensor research rig that reports anomaly signatures, never identities"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "cryptography>=42", "PyNaCl>=1.5", "noiseprotocol>=0.3.1"]

[project.optional-dependencies]
hw = ["bleak>=0.22", "pyserial>=3.5", "opencv-python-headless>=4.9", "adafruit-circuitpython-mlx90640>=1.3", "gpiozero>=2.0"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.10", "pip-licenses>=5"]

[project.scripts]
oiris = "oiris.cli:main"
asb = "oiris.cli:main"  # backward-compatible alias

[project.entry-points."oiris.plugins"]
# third-party packages add:  myplugin = "my_pkg.oiris_plugin:register"

[tool.setuptools.packages.find]
include = ["oiris*"]

[tool.setuptools.package-data]
"oiris.ui" = ["design_tokens.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E701", "E702", "E731", "B010", "I001", "E401", "B023", "B905"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741", "B017", "B018"]
